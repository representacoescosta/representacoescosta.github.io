name: diag fontes (temporario)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0"
          echo "== DTB"; curl -s -A "$UA" --max-time 30 https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/divisao_territorial/ | grep -oE 'href="[0-9]{4}/?"' | tail -3
          curl -s -A "$UA" --max-time 30 https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/divisao_territorial/2024/ | grep -oE 'href="[^"]+"' | grep -vi 'facebook|insta|tiktok|twitter|youtube' | tail -8
          echo "== CONCLA"; for u in https://concla.ibge.gov.br/images/concla/documentacao/CNAE_Subclasses_2_3_Estrutura_Detalhada.xlsx https://concla.ibge.gov.br/images/concla/downloads/revisao2007/PropCNAE20/CNAE20_Subclasses_EstruturaDetalhada.xls; do echo "$u -> $(curl -s -A "$UA" -o /dev/null -w '%{http_code} %{size_download}B' --max-time 30 "$u")"; done
          echo "== RFB"; for u in https://arquivos.receitafederal.gov.br/ https://arquivos.receitafederal.gov.br/dados/cnpj/ https://arquivos.receitafederal.gov.br/public.php/dav/files/gn672Ad4CF8N6TK/ https://dadosabertos.rfb.gov.br/CNPJ/; do echo "$u -> $(curl -s -A "$UA" -o /tmp/x -w '%{http_code} %{size_download}B' --max-time 30 "$u")"; grep -oE 'href="[^"]+"' /tmp/x | head -5; done
          echo "== ftp cnae"; curl -s -A "$UA" --max-time 30 https://ftp.ibge.gov.br/ | grep -oiE 'href="[^"]*(cnae|classif|concla)[^"]*"' | head
