# Atualiza os cadastros oficiais do banco do sistema RC (Supabase) pelas APIs públicas:
# estados e municípios (IBGE), CNAE (IBGE), bancos (Banco Central), feriados (BrasilAPI + regras da RC)
# e NCM (Siscomex). Roda no dia 1º de cada mês. A função recusa nova carga com menos de 6 horas.
name: Cadastros oficiais RC

on:
  schedule:
    - cron: "41 8 1 * *"   # dia 1º, 05:41 em Brasília
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Atualizar cadastros oficiais
        run: |
          resp=$(curl -sS --max-time 400 -w ' HTTP%{http_code}' -X POST -H "Content-Type: application/json" -d '{}' \
            "https://fufwenjnnsvxdgnenpch.supabase.co/functions/v1/carga-referencias")
          echo "Resposta: $resp"
          case "$resp" in *falhou*) echo "::error::Alguma parte da carga falhou (ver rc.integracao_execucao)"; exit 1 ;; *HTTP200|*HTTP429) ;; *) exit 1 ;; esac
