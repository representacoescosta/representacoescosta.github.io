# Atualiza os cadastros oficiais do banco do sistema RC (Supabase) pelas APIs públicas:
# estados e municípios (IBGE), CNAE (IBGE), bancos (Banco Central), feriados (BrasilAPI + regras da RC)
# e NCM (Siscomex). Roda no dia 1º de cada mês.
# O IBGE não responde a partir do servidor do banco; por isso este robô baixa estados, municípios e CNAE,
# guarda uma cópia enxuta (só dados públicos) em dados/referencias/ e a função lê essa cópia pelo commit exato.
# Cada parte é uma chamada; parte feita há menos de 6 horas é pulada.
name: Cadastros oficiais RC

on:
  schedule:
    - cron: "41 8 1 * *"   # dia 1º, 05:41 em Brasília
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: cadastros-oficiais

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Baixar IBGE (estados, municípios, CNAE)
        run: |
          set -euo pipefail
          mkdir -p dados/referencias /tmp/ibge
          baixa() { curl -sSf --retry 4 --retry-delay 10 --max-time 180 -H "Accept: application/json" "$1" -o "$2"; }
          baixa https://servicodados.ibge.gov.br/api/v1/localidades/estados /tmp/ibge/uf.json
          baixa https://servicodados.ibge.gov.br/api/v1/localidades/municipios /tmp/ibge/mun.json
          baixa https://servicodados.ibge.gov.br/api/v2/cnae/subclasses /tmp/ibge/cnae.json
          jq -c '[.[] | {id, sigla, nome, regiao: .regiao.nome}] | sort_by(.id)' /tmp/ibge/uf.json > dados/referencias/uf.json
          jq -c '[.[] | {id, nome, uf: (.microrregiao.mesorregiao.UF.id // ."regiao-imediata"."regiao-intermediaria".UF.id)}] | sort_by(.id)' /tmp/ibge/mun.json > dados/referencias/municipios.json
          jq -c '[.[] | {id, descricao, classe: .classe.id, grupo: .classe.grupo.id, divisao: .classe.grupo.divisao.id, secao: .classe.grupo.divisao.secao.id}] | sort_by(.id)' /tmp/ibge/cnae.json > dados/referencias/cnae.json
          n_uf=$(jq length dados/referencias/uf.json); n_mun=$(jq length dados/referencias/municipios.json); n_cnae=$(jq length dados/referencias/cnae.json)
          sem_uf=$(jq '[.[] | select(.uf == null)] | length' dados/referencias/municipios.json)
          echo "Estados: $n_uf · Municípios: $n_mun (sem estado: $sem_uf) · CNAE: $n_cnae"
          [ "$n_uf" -eq 27 ] && [ "$n_mun" -gt 5500 ] && [ "$sem_uf" -eq 0 ] && [ "$n_cnae" -gt 1000 ] || { echo "::error::Dados do IBGE incompletos"; exit 1; }

      - name: Guardar a cópia (só se mudou)
        run: |
          git config user.name "Robô RC"; git config user.email "actions@github.com"
          git add dados/referencias
          git diff --cached --quiet || { git commit -qm "Cadastros oficiais: cópia do IBGE de $(date -u +%Y-%m-%d)"; git push -q; }
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Atualizar o banco (uma parte por chamada)
        run: |
          erro=0
          for parte in uf-municipio bancos feriados ncm cnae; do
            resp=$(curl -sS --max-time 170 -w ' HTTP%{http_code}' -X POST -H "Content-Type: application/json" \
              -d "{\"parte\":\"$parte\",\"commit\":\"$SHA\"}" "https://fufwenjnnsvxdgnenpch.supabase.co/functions/v1/carga-referencias" || echo "sem resposta")
            echo "$parte: $resp"
            case "$resp" in *falhou*|"sem resposta"*) erro=1 ;; *HTTP200) ;; *) erro=1 ;; esac
          done
          [ $erro = 0 ] || { echo "::error::Alguma parte da carga falhou (ver rc.integracao_execucao)"; exit 1; }
