# Atualiza os cadastros oficiais do banco do sistema RC (Supabase) pelas APIs públicas:
# estados e municípios (IBGE), CNAE (IBGE), bancos (Banco Central), feriados (BrasilAPI + regras da RC)
# e NCM (Siscomex). Roda no dia 1º de cada mês.
# A API do IBGE não responde fora do Brasil nem a partir do servidor do banco; por isso este robô baixa os
# arquivos oficiais do IBGE (DTB do geoftp e CNAE 2.3 do CONCLA), guarda uma cópia enxuta (só dados públicos)
# em dados/referencias/ e a função lê essa cópia pelo commit exato.
# Cada parte é uma chamada; parte feita há menos de 6 horas é pulada.
name: Cadastros oficiais RC

on:
  schedule:
    - cron: "41 8 1 * *"   # dia 1º, 05:41 em Brasília
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: cadastros-oficiais

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Baixar IBGE (DTB e CNAE 2.3, arquivos oficiais)
        run: |
          set -euo pipefail
          mkdir -p dados/referencias /tmp/ibge
          UA="Mozilla/5.0 (RepresentacoesCosta-SistemaRC)"
          BASE=https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/divisao_territorial
          ANO=$(curl -sSf -A "$UA" --retry 3 --max-time 60 "$BASE/" | grep -oE 'href="20[0-9]{2}/"' | grep -oE '20[0-9]{2}' | sort -n | tail -1)
          ZIP=$(curl -sSf -A "$UA" --retry 3 --max-time 60 "$BASE/$ANO/" | grep -oE 'href="DTB_[^"]+\.zip"' | head -1 | cut -d'"' -f2)
          echo "DTB: $ANO/$ZIP"
          curl -sSf -A "$UA" --retry 3 --max-time 300 "$BASE/$ANO/$ZIP" -o /tmp/ibge/DTB.zip
          curl -sSf -A "$UA" --retry 3 --max-time 120 https://concla.ibge.gov.br/images/concla/documentacao/CNAE_Subclasses_2_3_Estrutura_Detalhada.xlsx -o /tmp/ibge/cnae.xlsx
          pip install -q pandas openpyxl xlrd odfpy
          python3 .github/scripts/ibge.py /tmp/ibge dados/referencias

      - name: Guardar a cópia (só se mudou)
        run: |
          git config user.name "Robô RC"; git config user.email "actions@github.com"
          git add dados/referencias
          git diff --cached --quiet || { git commit -qm "Cadastros oficiais: cópia do IBGE de $(date -u +%Y-%m-%d)"; git push -q; }
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Atualizar o banco (uma parte por chamada)
        run: |
          erro=0
          for parte in uf-municipio bancos feriados ncm cnae; do
            resp=$(curl -sS --max-time 170 -w ' HTTP%{http_code}' -X POST -H "Content-Type: application/json" \
              -d "{\"parte\":\"$parte\",\"commit\":\"$SHA\"}" "https://fufwenjnnsvxdgnenpch.supabase.co/functions/v1/carga-referencias" || echo "sem resposta")
            echo "$parte: $resp"
            case "$resp" in *falhou*|"sem resposta"*) erro=1 ;; *HTTP200) ;; *) erro=1 ;; esac
          done
          [ $erro = 0 ] || { echo "::error::Alguma parte da carga falhou (ver rc.integracao_execucao)"; exit 1; }
